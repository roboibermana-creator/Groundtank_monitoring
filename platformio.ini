[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
	-DARDUINO_USB_CDC_ON_BOOT=1
lib_deps = 
	marcoschwartz/LiquidCrystal_I2C@^1.1.4
	arduino-libraries/Ethernet@^2.0.2
	openslab-osu/SSLClient@^1.6.11
	bblanchon/ArduinoJson@^6.21.5

; Upload dari PC lewat kabel LAN (W5500), tanpa USB:
;   pio run -e lan -t upload
; Isi upload_port dengan IP ESP Groundtank. Password dibaca dari include/secrets.h
; (LAN_UPDATE_PASSWORD) oleh scripts/lan_upload.py. Hanya jalan bila firmware >= 1.0.3 sudah terpasang.
[env:lan]
extends = env:esp32-s3-devkitc-1
upload_protocol = custom
upload_command = curl
upload_port = 192.168.22.40
extra_scripts = post:scripts/lan_upload.py
